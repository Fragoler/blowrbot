version: '3'

dotenv: ['.env']

vars:
  GO_VERSION: '1.26.5'
  GCI_VERSION: 'v0.14.0'
  GOLINT_VERSION: 'v2.13.1'
  GOFUMPT_VERSION: 'v0.11.0'
  GOOSE_VERSION: 'v3.28.0'

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  GOOSE: "{{.BIN_DIR}}/goose"
  

tasks:
  default:
    cmds:
      - "task --list"
  
  # ── Install ────────────────────────────────────────────────
  install:go:
    desc: Verify / install Go {{.GO_VERSION}}
    silent: true
    cmds:
      - |
        current=$(go version 2>/dev/null | grep -oP 'go\K[0-9]+\.[0-9]+\.[0-9]+' || true)
        if [ "$current" != "{{.GO_VERSION}}" ]; then
          echo "⚠  Go {{.GO_VERSION}} is not active (found ${current:-none})."
          echo "   Install it via your version manager (goenv / asdf / mise) or:"
          echo "     go install golang.org/dl/go{{.GO_VERSION}}@latest"
          echo "     go{{.GO_VERSION}} download"
          exit 1
        fi
        echo "✔  Go {{.GO_VERSION}}"
    status:
      - '[[ $(go version) == *"go{{.GO_VERSION}}"* ]]'

  install:gci:
    desc: Install gci {{.GCI}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
    status:
      - "{{.GCI}} --version 2>/dev/null | grep -q '{{trimPrefix \"v\" .GCI_VERSION}}'"

  install:golint:
    desc: Install golangci-lint {{.GOLINT}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLINT_VERSION}}
    status:
      - "{{.GOLANGCI_LINT}} version 2>/dev/null | grep -q '{{trimPrefix \"v\" .GOLINT_VERSION}}'"

  install:gofmt:
    desc: Install gofumpt {{.GOFMT}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
    status:
      - "{{.GOFUMPT}} --version 2>/dev/null | grep -q '{{trimPrefix \"v\" .GOFUMPT_VERSION}}'"

  install:goose:
    desc: Install goose {{.GOOSE_VERSION}}
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
    status:
      - "{{.GOOSE}} -version 2>/dev/null | grep -q '{{trimPrefix \"v\" .GOOSE_VERSION}}'"

  install:
    desc: Install all linters & formatters
    deps:
      - install:go
      - install:gci
      - install:golint
      - install:gofmt
      - install:goose

  # ── Lint ───────────────────────────────────────────────────

  lint:
    desc: Run golangci-lint
    deps: [install:golint]
    cmds:
      # The build tag is needed or the integration tests go unlinted.
      - "{{.GOLANGCI_LINT}} run --build-tags=integration ./..."

  lint:fix:
    desc: Run golangci-lint with auto-fix
    deps: [install:golint]
    cmds:
      - "{{.GOLANGCI_LINT}} run --build-tags=integration --fix ./..."

  # ── Format ────────────────────────────────────────────────

  fmt:
    desc: Format code
    deps: [install:gofmt, install:gci]
    cmds:
      - "{{.GOFUMPT}} -w ."
      - "{{.GCI}} write --skip-generated -s standard -s default -s localmodule ."

  fmt:check:
    desc: Check formatting without modifying files
    deps: [install:gofmt, install:gci]
    cmds:
      # gofumpt -d exits non-zero on a diff, gci diff does not: gate it by output.
      - "{{.GOFUMPT}} -d ."
      - |
        drift=$({{.GCI}} diff --skip-generated -s standard -s default -s localmodule .)
        if [ -n "$drift" ]; then
          echo "$drift"
          echo "imports are not sorted; run: task fmt"
          exit 1
        fi

  # ── Migrations ────────────────────────────────────────────
  migrate:up:
    desc: Apply all pending migrations
    deps: [install:goose]
    env: &goose_env
      GOOSE_DRIVER: postgres  
      GOOSE_MIGRATION_DIR: "{{.ROOT_DIR}}/migrations"
    cmds:
      - "{{.GOOSE}} up"

  migrate:down:
    desc: Roll back the last migration
    deps: [install:goose]
    env: *goose_env
    cmds:
      - "{{.GOOSE}} down"

  migrate:status:
    desc: Show which migrations are applied
    deps: [install:goose]
    env: *goose_env
    cmds:
      - "{{.GOOSE}} status"

  migrate:create:
    desc: Create a new migration, e.g. task migrate:create -- add_bans_index
    deps: [install:goose]
    env: *goose_env
    cmds:
      - "{{.GOOSE}} -s create {{.CLI_ARGS}} sql"

  # ── Test ──────────────────────────────────────────────────

  test:
    desc: Run unit tests
    cmds:
      - go test ./... -count=1

  test:cover:
    desc: Run unit tests with coverage
    cmds:
      - go test ./... -count=1 -cover

  test:integration:
    desc: Run storage tests against a real Postgres (needs LOUDBOT_TEST_POSTGRES)
    cmds:
      - go test -tags=integration ./... -count=1

  # ── BUILD ─────────────────────────────────────────────────
  build:
    desc: Build project
    cmds:
      - GOBIN={{.BIN_DIR}} go build -o {{.BIN_DIR}}/loudbot ./cmd/loudbot/main.go

  # ── Docker ────────────────────────────────────────────────

  docker:build:
    desc: Build the deploy image locally
    cmds:
      - docker build -f deploy/Dockerfile -t loudbot:local --build-arg VERSION=local .

  # ── RUN ───────────────────────────────────────────────────
  run:
    desc: Run project
    cmds:
      - GOBIN={{.BIN_DIR}} go run ./cmd/loudbot/main.go
        
version: "2"
linters:
  enable:
    - asciicheck
    - depguard
    - errorlint
    - gosec
    - importas
    - misspell
    - prealloc
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
#  disable:
#    - errcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: crypto/sha256
              desc: use crypto.SHA256 instead
            - pkg: crypto/sha512
              desc: use crypto.SHA512 instead
#    gosec:
#      excludes:
#        - G117 # Exported sensitive fields
#        - G703 # Path taint (from arguments)
#        - G704 # SSRF taint (raised when constructing URLs)
#        - G706 # Log taint (from arguments)
    revive:
      enable-default-rules: true
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: test # Excludes /test, *_test.go etc.
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      module-path: loudbot
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$